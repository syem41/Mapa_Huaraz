<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Encuestas · Rutas y Campo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f4f2e9;--panel:#fffef8;--line:#d9d6c9;--muted:#6b7280;--live:#7c3aed;--ok:#16805b;--danger:#c62828}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}body{background:linear-gradient(180deg,var(--paper),#f7f7f6);color:var(--ink);}
.login{height:100%;display:flex;align-items:center;justify-content:center}
.loginbox{width:360px;background:var(--panel);padding:28px;border-radius:10px;box-shadow:0 8px 30px rgba(20,33,61,0.08);}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:transparent}
.tabs .on{background:var(--live);color:white;border-color:transparent}
.hidden{display:none}
.btn{display:inline-block;padding:8px 12px;border-radius:6px;border:0;background:var(--live);color:#fff}
.btn.full{width:100%}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.app{display:flex;height:calc(100% - 64px)}
.side{width:320px;padding:12px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.main{flex:1;display:flex;flex-direction:column}
#map{flex:1}
.cards{display:flex;gap:8px}
.card{background:#fff;padding:10px;border-radius:8px;flex:1;text-align:center}
.small{font-size:12px;color:var(--muted)}
.label{font-size:13px;color:var(--muted);margin-bottom:8px}
.item{padding:8px;border-bottom:1px solid var(--line)}
.itemhead{display:flex;justify-content:space-between;align-items:center}
.tiny{font-size:12px;color:var(--muted)}
.ba{background:#eef2ff;padding:6px 8px;border-radius:6px;margin-left:8px}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>Encuestas · Campo</h2><p>Rutas, zonas, GPS, metas y trazabilidad.</p><div class="tabs"><button id="tabAdmin" class="on" onclick="setLoginRole('admin')">Administrador</button><button id="tabEnc" onclick="setLoginRole('encuestador')">Encuestador</button></div>
<div id="adminLogin" class="adminLogin"><div class="block"><div class="label">Administrador</div><div style="display:flex;gap:8px;margin-bottom:8px"><input id="loginUser" placeholder="Usuario" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--line)"><input id="loginPass" type="password" placeholder="Contraseña" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--line)"></div><button id="loginBtn" class="btn full" onclick="login()">Iniciar sesión</button></div></div>
<div id="encLogin" class="encLogin hidden"><div class="block"><div class="label">Encuestador</div><div style="display:flex;gap:8px;margin-bottom:8px"><select id="loginNumber" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--line)"></select><input id="loginEncPass" type="password" placeholder="Contraseña" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--line)"></div><button id="loginBtnEnc" class="btn full" onclick="login()">Iniciar sesión</button></div></div>
</div></div>
<header class="top hidden" id="top"><div><h1>Encuestas · Huaraz / Independencia</h1><small>Rutas · zonas · GPS · metas · trazabilidad</small></div><div class="userbar"><span id="who" class="ba">—</span><button class="btn" id="logoutBtn" onclick="logout()">Salir</button></div></header>
<div id="app" class="app hidden"><aside id="side" class="side"></aside><main class="main"><div id="map" style="height:100%"></div></main></div>
<div id="toast" class="hidden" style="position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:rgba(0,0,0,0.8);color:#fff;padding:8px 12px;border-radius:6px"></div>
<script>
const DATA={"manzanas": [{"distrito": "INDEPENDENCIA", "zona_censal": "00700", "manzana": "033", "lat": -9.52249, "lon": -77.522932}, {"distrito": "INDEPENDENCIA", "zona_censal": "00600", "manzana": "028", "lat": -9.52534, "lon": -77.5254}]};
let TOKEN=sessionStorage.getItem('token'),USER=JSON.parse(sessionStorage.getItem('user')||'null');
const api=async(url,opt={})=>{opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},TOKEN?{Authorization:'Bearer '+TOKEN}:{});const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||r.statusText);return d}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function setLoginRole(role){const adminLogin=document.getElementById('adminLogin');const encLogin=document.getElementById('encLogin');const tabAdmin=document.getElementById('tabAdmin');const tabEnc=document.getElementById('tabEnc');adminLogin.classList.toggle('hidden',role!=='admin');encLogin.classList.toggle('hidden',role!=='encuestador');tabAdmin.classList.toggle('on',role==='admin');tabEnc.classList.toggle('on',role==='encuestador');document.getElementById('login').dataset.role=role}
async function loadEncChoices(){try{const d=await fetch('/api/encuestadores/public').then(r=>r.json());loginNumber.innerHTML=d.map(x=>`<option value="${x.numero}">Encuestador ${x.numero} — ${x.nombre}</option>`).join('');}catch(e){console.error(e)} }
async function login(){const login=document.getElementById('login');const role=login.dataset.role||'admin';const body=role==='admin'?{usuario:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value}:{numero:document.getElementById('loginNumber').value,password:document.getElementById('loginEncPass').value};try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');TOKEN=d.token;USER=d.user;sessionStorage.setItem('token',TOKEN);sessionStorage.setItem('user',JSON.stringify(USER));startApp();}catch(e){toast(e.message)} }
function logout(){sessionStorage.clear();location.reload()}
let map,drawn,drawControl,markers={},routeLayers=L.layerGroup(),gpsLayer=L.layerGroup(),refLayers={};
function initMap(){map=L.map('map').setView([-9.527,-77.529],14.2);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);routeLayers.addTo(map);gpsLayer.addTo(map)}
function clearMarkers(){Object.values(markers).forEach(x=>map.removeLayer(x));markers={}}
function renderManzanas(assignments=[]){clearMarkers();const byId={};assignments.forEach(a=>byId[a.manzana_id]=a);DATA.manzanas.forEach(m=>{const a=byId[m.id],col=a?'#7c3aed':'#9ca3af';const html=`<div style="font-size:12px"><strong>${m.manzana}</strong><div class=\"tiny\">${m.distrito} · ${m.zona_censal}</div></div>`;const marker=L.circleMarker([m.lat,m.lon],{radius:8,color:col}).bindPopup(html).addTo(map);markers[m.id]=marker})}
async function startApp(){document.getElementById('login').classList.add('hidden');document.getElementById('top').classList.remove('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=USER.rol==='admin'?'ADMIN · '+USER.usuario:`ENCUESTADOR ${USER.numero}`;initMap();renderManzanas([])}
let ENC=[],selectedManzanas=[];
async function renderAdmin(){document.getElementById('side').innerHTML=`<div class="block"><div class="label">Resumen</div><div class="cards"><div class="card"><b id="rEnc">—</b><span>encuestadores</span></div><div class="card"><b id="rMan">—</b><span>manzanas</span></div></div></div>`}
async function refreshAdmin(){const [enc,res,cs]=await Promise.all([api('/api/encuestadores'),api('/api/resumen'),api('/api/contadores')]);ENC=enc;document.getElementById('rEnc').textContent=res.encuestadores;document.getElementById('rMan').textContent=res.manzanas}
async function loadAdminEnc(){const id=Number(document.getElementById('selectedEnc').value);if(!id)return;const as=await api('/api/asignaciones/'+id);selectedManzanas=as.map(a=>a.manzana_id);document.getElementById('selStats').textContent=`${as.length} asignadas`}
function toggleAssign(id){const i=selectedManzanas.indexOf(id);if(i>=0)selectedManzanas.splice(i,1);else selectedManzanas.push(id);const as=selectedManzanas.map((mid,i)=>({manzana_id:mid,orden_visita:i+1}));document.getElementById('selStats').textContent=`${as.length} asignadas`;}
async function saveAssignments(){const id=Number(document.getElementById('selectedEnc').value);try{await api('/api/asignaciones',{method:'POST',body:JSON.stringify({encuestador_id:id,manzanas:selectedManzanas})});toast('Asignaciones guardadas');await refreshAdmin()}catch(e){toast(e.message)}}
async function saveDrawing(){const encId=Number(document.getElementById('geoEnc').value),type=document.getElementById('geoType').value,name=document.getElementById('geoName').value.trim();if(!name)return toast('Pon un nombre');const layers=[];drawn.eachLayer(l=>layers.push(l.toGeoJSON()));await api('/api/geometrias',{method:'POST',body:JSON.stringify({encuestador_id:encId,tipo:type,nombre:name,geojson:layers})});loadGeos(encId);toast('Geometría guardada')}
async function loadGeos(id){routeLayers.clearLayers();drawn.clearLayers();const gs=await api('/api/geometrias/'+id);document.getElementById('geoList').innerHTML=gs.map(g=>`<div class="item"><div class="itemhead"><strong class="tiny">${g.tipo}</strong><span class="tiny">${new Date(g.created_at).toLocaleString()}</span></div><div style="padding:6px 0">${g.nombre}</div></div>`).join('')}
async function delGeo(id){await api('/api/geometrias/'+id,{method:'DELETE'});loadGeos(Number(document.getElementById('geoEnc').value))}
async function refreshGps(){try{const r=await api('/api/ubicaciones');document.getElementById('gpsAdmin').innerHTML=r.map(x=>`<div class="item"><div class="itemhead"><strong>Encuestador ${x.numero}</strong><span class="tiny">${timeAgo(x.fecha_hora)}</span></div><div style="padding:6px 0">${x.lat}, ${x.lon} · ±${x.precision_m}m</div></div>`).join('')}catch(e){toast(e.message)}}
function editAdminCredentials(){const usuario=prompt('Nuevo usuario',USER.usuario);if(usuario===null)return;const password=prompt('Nueva contraseña (vacío = conservar)');api('/api/admin/credentials',{method:'PUT',body:JSON.stringify({usuario,password})}).then(()=>toast('Credenciales actualizadas')).catch(e=>toast(e.message))}
function newEnc(){const numero=prompt('Número del encuestador');if(!numero)return;const nombre=prompt('Nombre completo');if(!nombre)return;const usuario=prompt('Usuario','enc'+numero);if(!usuario)return;const password=prompt('Contraseña inicial');if(!password)return;api('/api/encuestadores',{method:'POST',body:JSON.stringify({numero,nombre,usuario,password})}).then(()=>toast('Encuestador creado')).catch(e=>toast(e.message))}
function editEnc(id){const e=ENC.find(x=>x.id===id);const nombre=prompt('Nombre',e.nombre);if(nombre===null)return;const usuario=prompt('Usuario',e.usuario);if(usuario===null)return;const password=prompt('Nueva contraseña (vacío = conservar)');api('/api/encuestadores/'+id,{method:'PUT',body:JSON.stringify({numero:e.numero,nombre,usuario,activo:e.activo,password})}).then(()=>refreshAdmin()).catch(e=>toast(e.message))}
function newCounter(){const nombre=prompt('Nombre');if(!nombre)return;const meta=Number(prompt('Meta',100)||0);const n=prompt('Número de encuestador (vacío = todos)');const descrip=prompt('Descripción (opcional)');api('/api/contadores',{method:'POST',body:JSON.stringify({encuestador_id:n||null,nombre,descripcion:descrip,meta,criterio_json:null})}).then(()=>toast('Contador creado')).catch(e=>toast(e.message))}
async function showHistory(){const h=await api('/api/historial');alert(h.map(x=>`${new Date(x.fecha_hora).toLocaleString()} · ${x.nombre||'sistema'} · ${x.accion}\n${x.descripcion}`).join('\n\n'))}
async function renderEncuestador(){document.getElementById('side').innerHTML=`<div class="block"><div class="label">Mi recorrido</div><div id="encSummary" class="cards"></div><button id="locBtn" class="btn full" style="margin-top:8px">📍 Activar ubicación</button></div>`}
async function refreshEnc(){const [as,gs,cs]=await Promise.all([api('/api/asignaciones/'+USER.id),api('/api/geometrias/'+USER.id),api('/api/contadores')]);document.getElementById('encSummary').innerHTML=`<div class="card"><b>${as.length}</b><span>asignadas</span></div>`}
async function counterChange(id,d){try{await api(`/api/contadores/${id}/${d>0?'sumar':'restar'}`,{method:'POST'});await refreshEnc()}catch(e){toast(e.message)}}
async function toggleVisited(id,state){await api('/api/asignaciones/'+id+'/estado',{method:'PUT',body:JSON.stringify({estado:state==='visitada'?'pendiente':'visitada'})});refreshEnc()}
let watch=null,me=null;function toggleGPS(){if(watch){navigator.geolocation.clearWatch(watch);watch=null;if(me){map.removeLayer(me);me=null}document.getElementById('locBtn').textContent='📍 Activar ubicación';return}watch=navigator.geolocation.watchPosition(pos=>{const c=[pos.coords.latitude,pos.coords.longitude];if(me)map.removeLayer(me);me=L.circleMarker(c,{radius:8,color:'#7c3aed'}).addTo(map);map.setView(c);fetch('/api/ubicacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy})})},err=>{toast('No se pudo obtener ubicación: '+err.message)},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
function timeAgo(v){const s=Math.max(0,Math.round((Date.now()-new Date(v).getTime())/1000));return s<60?`hace ${s}s`:`hace ${Math.round(s/60)} min`}function esc(s){return String(s??'').replace(/[&"'<>]/g,c=>({'&':'&amp;','"':'&quot;',"'":'&#39;','<':'&lt;','>':'&gt;'}[c]))}
if(TOKEN&&USER)startApp();else{document.getElementById('login').dataset.role='admin';loadEncChoices()}
</script></body></html>
