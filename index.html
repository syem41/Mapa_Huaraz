function initMap(){map=L.map('map').setView([-9.527,-77.529],14.2);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});L.control.layers({'OpenStreetMap':osm,'Satélite':sat}).addTo(map);refLayers.huaraz=L.layerGroup();(DATA.boundaries.huaraz||[]).forEach(r=>L.polygon(r,{color:'#2a7f62',weight:1,fillOpacity:.03,interactive:false}).addTo(refLayers.huaraz));refLayers.huaraz.addTo(map);refLayers.independencia=L.layerGroup();(DATA.boundaries.independencia||[]).forEach(r=>L.polygon(r,{color:'#3d6fb4',weight:1,fillOpacity:.03,interactive:false}).addTo(refLayers.independencia));refLayers.independencia.addTo(map);drawn=new L.FeatureGroup().addTo(map);drawControl=new L.Control.Draw({edit:{featureGroup:drawn},draw:{polygon:{shapeOptions:{color:'#075e54'}},polyline:{shapeOptions:{color:'#b42318',weight:4}},rectangle:{shapeOptions:{color:'#075e54'}},marker:true,circle:false,circlemarker:false}});if(USER.rol==='admin')map.addControl(drawControl);map.on(L.Draw.Event.CREATED,e=>{if(USER.rol==='admin')drawn.addLayer(e.layer)})}

function renderManzanas(assignments=[]){clearMarkers();const byId={};assignments.forEach(a=>byId[a.manzana_id]=a);DATA.manzanas.forEach(m=>{const a=byId[m.id],col=a?'#7c3aed':'#9ca3af';const html=`<div style="width:${a?20:9}px;height:${a?20:9}px;border-radius:${a?'50% 50% 50% 0':'50%'};background:${col};border:2px solid white;box-shadow:0 1px 3px #0006;transform:${a?'rotate(-45deg)':'none'};display:flex;align-items:center;justify-content:center;color:white;font:9px IBM Plex Mono">${a?(a.orden_visita||''):''}</div>`;const mk=L.marker([m.lat,m.lon],{icon:L.divIcon({className:'',html,iconSize:[a?20:9,a?20:9],iconAnchor:[a?10:4,a?20:4]})}).addTo(map);mk.bindPopup(`<b>Manzana ${m.manzana}</b><br>${m.distrito} · zona ${m.zona_censal}<br>${a?`Orden ${a.orden_visita} · ${a.estado}`:'Sin asignar'}`);if(USER.rol==='admin')mk.on('click',()=>toggleAssign(m.id));markers[m.id]=mk})}
async function startApp(){login.classList.add('hidden');top.classList.remove('hidden');app.classList.remove('hidden');who.textContent=USER.rol==='admin'?'ADMIN · '+USER.usuario:`ENCUESTADOR ${USER.numero} · ${USER.nombre}`;if(!map)initMap();USER.rol==='admin'?await renderAdmin():await renderEncuestador()}
let ENC=[],selectedManzanas=[];
async function renderAdmin(){side.innerHTML=`<div class="block"><div class="label">Resumen</div><div class="cards"><div class="card"><b id="rEnc">—</b><span>encuestadores</span></div><div class="card"><b id="rMan">—</b><span>manzanas</span></div><div class="card"><b id="rAs">—</b><span>asignaciones</span></div><div class="card"><b id="rVi">—</b><span>visitadas</span></div></div></div><div class="block"><div class="label">Encuestadores</div><div class="grid2"><button class="btn" onclick="newEnc()">+ Crear</button><button class="btn alt" onclick="showHistory()">Huella</button></div><button class="btn alt full" style="margin-top:7px" onclick="editAdminCredentials()">Cambiar mis credenciales</button><div id="encList" class="list" style="margin-top:8px"></div></div><div class="block"><div class="label">Asignar manzanas</div><select id="selectedEnc" onchange="loadAdminEnc()"></select><p class="hint">Selecciona un encuestador. En el mapa, haz clic en una manzana para agregarla/quitarla. Guarda al terminar.</p><div class="grid2"><button class="btn green" onclick="saveAssignments()">Guardar</button><button class="btn alt" onclick="loadAdminEnc()">Recargar</button></div><div id="selStats" class="tiny" style="margin-top:7px"></div></div><div class="block"><div class="label">Rutas y zonas</div><select id="geoEnc"></select><div class="grid2" style="margin-top:7px"><select id="geoType"><option value="ruta">Ruta</option><option value="zona">Zona</option></select><input id="geoName" placeholder="Nombre"></div><button class="btn full" style="margin-top:7px" onclick="saveDrawing()">Guardar dibujo</button><div id="geoList" class="list" style="margin-top:8px"></div></div><div class="block"><div class="label">Contadores / metas</div><button class="btn full" onclick="newCounter()">+ Crear contador</button><div id="counterAdmin" class="list" style="margin-top:8px"></div></div><div class="block"><div class="label">GPS en campo · se actualiza cada 4 s</div><div id="gpsAdmin" class="list"><div class="hint">Actualizando…</div></div></div>`;await refreshAdmin();setInterval(refreshGps,4000)}
async function refreshAdmin(){const [enc,res,cs]=await Promise.all([api('/api/encuestadores'),api('/api/resumen'),api('/api/contadores')]);ENC=enc;rEnc.textContent=res.encuestadores;rMan.textContent=res.manzanas;rAs.textContent=res.asignaciones;rVi.textContent=res.visitadas;encList.innerHTML=enc.map(e=>`<div class="item"><div class="itemhead"><strong>Encuestador ${e.numero}</strong><span class="tiny">${e.activo?'ACTIVO':'INACTIVO'}</span><button class="btn alt" onclick="editEnc(${e.id})">Editar</button></div><div class="tiny">${esc(e.nombre)} · ${esc(e.usuario)}</div></div>`).join('')||'<div class="hint">Aún no hay encuestadores.</div>';const opts=enc.map(e=>`<option value="${e.id}">#${e.numero} — ${e.nombre}</option>`).join('');selectedEnc.innerHTML=opts;geoEnc.innerHTML=opts;if(enc.length)await loadAdminEnc();counterAdmin.innerHTML=cs.map(c=>`<div class="item"><div class="itemhead"><strong>${esc(c.nombre)}</strong><span class="tiny">${c.valor}/${c.meta}</span></div><div class="progress"><i style="width:${c.meta?Math.min(100,c.valor/c.meta*100):0}%"></i></div><div class="tiny">${c.encuestador_id?'Encuestador '+(enc.find(e=>e.id===c.encuestador_id)?.numero||''):'Todos'}</div></div>`).join('')||'<div class="hint">No hay contadores.</div>';await refreshGps()}
async function loadAdminEnc(){const id=Number(selectedEnc.value);if(!id)return;const as=await api('/api/asignaciones/'+id);selectedManzanas=as.map(a=>a.manzana_id);selStats.textContent=`${as.length} asignadas · ${as.filter(a=>a.estado==='visitada').length} visitadas`;renderManzanas(as);await loadGeos(id)}
function toggleAssign(id){const i=selectedManzanas.indexOf(id);if(i>=0)selectedManzanas.splice(i,1);else selectedManzanas.push(id);const as=selectedManzanas.map((mid,i)=>({manzana_id:mid,orden_visita:i+1,estado:'pendiente'}));renderManzanas(as);selStats.textContent=`${selectedManzanas.length} seleccionadas · sin guardar`}
async function saveAssignments(){const id=Number(selectedEnc.value);try{await api('/api/asignaciones',{method:'POST',body:JSON.stringify({encuestador_id:id,manzanas:selectedManzanas})});toast('Asignaciones guardadas');await refreshAdmin()}catch(e){toast(e.message)}}
async function saveDrawing(){const encId=Number(geoEnc.value),type=geoType.value,name=geoName.value.trim();if(!name)return toast('Pon un nombre');const layers=[];drawn.eachLayer(l=>layers.push(l.toGeoJSON()));if(!layers.length)return toast('Dibuja primero');const geojson=layers.length===1?layers[0]:{type:'FeatureCollection',features:layers};try{await api('/api/geometrias',{method:'POST',body:JSON.stringify({encuestador_id:encId,tipo:type,nombre,geojson})});toast('Dibujo guardado');geoName.value='';drawn.clearLayers();await loadGeos(encId)}catch(e){toast(e.message)}}
async function loadGeos(id){routeLayers.clearLayers();drawn.clearLayers();const gs=await api('/api/geometrias/'+id);geoList.innerHTML=gs.map(g=>`<div class="item"><div class="itemhead"><strong class="${g.tipo==='ruta'?'route':'zone'}">${g.tipo.toUpperCase()} · ${esc(g.nombre)}</strong><button class="btn alt" onclick="delGeo(${g.id})">×</button></div></div>`).join('')||'<div class="hint">Sin rutas/zonas.</div>';gs.forEach(g=>L.geoJSON(g.geojson,{style:{color:g.tipo==='ruta'?'#b42318':'#075e54',weight:g.tipo==='ruta'?4:2,fillOpacity:.08}}).addTo(routeLayers));routeLayers.addTo(map)}
async function delGeo(id){await api('/api/geometrias/'+id,{method:'DELETE'});loadGeos(Number(geoEnc.value))}
async function refreshGps(){try{const r=await api('/api/ubicaciones');gpsAdmin.innerHTML=r.map(x=>`<div class="item"><div class="itemhead"><strong>Encuestador ${x.numero}</strong><span class="tiny">${timeAgo(x.fecha_hora)}</span></div><div class="tiny">${esc(x.nombre)} · ${Number(x.lat).toFixed(5)}, ${Number(x.lon).toFixed(5)}${x.precision_m?' · ±'+Math.round(x.precision_m)+'m':''}</div></div>`).join('')||'<div class="hint">Sin posiciones todavía.</div>';gpsLayer.clearLayers();r.forEach(x=>L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:'<div class="pulse"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).bindPopup(`<b>Encuestador ${x.numero}</b><br>${esc(x.nombre)}`).addTo(gpsLayer));gpsLayer.addTo(map)}catch{}}
function editAdminCredentials(){const usuario=prompt('Nuevo usuario',USER.usuario);if(usuario===null)return;const password=prompt('Nueva contraseña (vacío = conservar)');api('/api/admin/credentials',{method:'PUT',body:JSON.stringify({usuario,password:password||undefined})}).then(()=>{toast('Credenciales del admin actualizadas');USER.usuario=usuario;sessionStorage.setItem('user',JSON.stringify(USER));who.textContent='ADMIN · '+usuario}).catch(e=>toast(e.message))}
function newEnc(){const numero=prompt('Número del encuestador');if(!numero)return;const nombre=prompt('Nombre completo');if(!nombre)return;const usuario=prompt('Usuario','enc'+numero);if(!usuario)return;const password=prompt('Contraseña inicial');if(!password)return;api('/api/encuestadores',{method:'POST',body:JSON.stringify({numero:Number(numero),nombre,usuario,password})}).then(()=>{toast('Encuestador creado');refreshAdmin()}).catch(e=>toast(e.message))}
function editEnc(id){const e=ENC.find(x=>x.id===id);const nombre=prompt('Nombre',e.nombre);if(nombre===null)return;const usuario=prompt('Usuario',e.usuario);if(usuario===null)return;const password=prompt('Nueva contraseña (vacío = conservar)');const activo=confirm('¿Mantener activo?');const body={numero:e.numero,nombre,usuario,activo};if(password)body.password=password;api('/api/encuestadores/'+id,{method:'PUT',body:JSON.stringify(body)}).then(()=>{toast('Credenciales actualizadas');refreshAdmin()}).catch(e=>toast(e.message))}
function newCounter(){const nombre=prompt('Nombre del contador');if(!nombre)return;const meta=Number(prompt('Meta',100)||0);const n=prompt('Número de encuestador (vacío = todos)');const descripcion=prompt('Descripción / criterio','Mujer de 22 a 27 años');api('/api/contadores',{method:'POST',body:JSON.stringify({nombre,meta,encuestador_id:n?Number(n):null,descripcion})}).then(()=>{toast('Contador creado');refreshAdmin()}).catch(e=>toast(e.message))}
async function showHistory(){const h=await api('/api/historial');alert(h.map(x=>`${new Date(x.fecha_hora).toLocaleString()} · ${x.nombre||'sistema'} · ${x.accion}\n${x.descripcion}`).join('\n\n')||'Sin historial')}
async function renderEncuestador(){side.innerHTML=`<div class="block"><div class="label">Mi recorrido</div><div id="encSummary" class="cards"></div><button id="locBtn" class="btn full" style="margin-top:8px" onclick="toggleGPS()">📍 Activar ubicación en tiempo real</button><div id="locStatus" class="loc">La ubicación se envía mientras la activas.</div></div><div class="block"><div class="label">Mis manzanas</div><div id="myAssignments" class="list"></div></div><div class="block"><div class="label">Mis contadores</div><div id="myCounters" class="list"></div></div>`;await refreshEnc();setInterval(refreshEnc,7000)}
async function refreshEnc(){const [as,gs,cs]=await Promise.all([api('/api/asignaciones/'+USER.id),api('/api/geometrias/'+USER.id),api('/api/contadores')]);encSummary.innerHTML=`<div class="card"><b>${as.length}</b><span>asignadas</span></div><div class="card"><b>${as.filter(a=>a.estado==='visitada').length}</b><span>visitadas</span></div>`;myAssignments.innerHTML=as.map(a=>`<div class="item"><div class="itemhead"><strong>${a.orden_visita}. Manzana ${a.manzana}</strong><span class="tiny">${a.estado}</span></div><div class="tiny">${a.distrito} · zona ${a.zona_censal}</div><button class="btn ${a.estado==='visitada'?'alt':'green'} full" style="margin-top:7px" onclick="toggleVisited(${a.id},'${a.estado}')">${a.estado==='visitada'?'↩ Marcar pendiente':'✓ Marcar visitada'}</button></div>`).join('')||'<div class="hint">No tienes manzanas asignadas.</div>';myCounters.innerHTML=cs.map(c=>{const p=c.meta?Math.min(100,c.valor/c.meta*100):0;return `<div class="item"><div class="counter"><div><div class="name">${esc(c.nombre)}</div><div class="tiny">${esc(c.descripcion||'')}</div></div><span class="value">${c.valor}/${c.meta}</span><button class="plusminus" onclick="counterChange(${c.id},-1)">−</button></div><div class="progress"><i style="width:${p}%"></i></div><button class="plusminus" style="width:100%" onclick="counterChange(${c.id},1)">+1</button></div>`}).join('')||'<div class="hint">No tienes contadores.</div>';routeLayers.clearLayers();gs.forEach(g=>L.geoJSON(g.geojson,{style:{color:g.tipo==='ruta'?'#b42318':'#075e54',weight:g.tipo==='ruta'?4:2,fillOpacity:.08}}).addTo(routeLayers));routeLayers.addTo(map);renderManzanas(as)}
async function counterChange(id,d){try{await api(`/api/contadores/${id}/${d>0?'sumar':'restar'}`,{method:'POST'});await refreshEnc()}catch(e){toast(e.message)}}
async function toggleVisited(id,state){await api('/api/asignaciones/'+id+'/estado',{method:'PUT',body:JSON.stringify({estado:state==='visitada'?'pendiente':'visitada'})});refreshEnc()}
let watch=null,me=null;function toggleGPS(){if(watch){navigator.geolocation.clearWatch(watch);watch=null;if(me){map.removeLayer(me);me=null}locBtn.textContent='📍 Activar ubicación en tiempo real';locStatus.textContent='Ubicación detenida.';return}if(!navigator.geolocation)return toast('Tu navegador no soporta GPS');locBtn.textContent='⏹ Detener ubicación';locStatus.textContent='Solicitando GPS…';watch=navigator.geolocation.watchPosition(async p=>{const c=p.coords;locStatus.textContent=`GPS activo · precisión ±${Math.round(c.accuracy)} m`;if(!me){me=L.marker([c.latitude,c.longitude],{icon:L.divIcon({className:'',html:'<div class="pulse"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);map.setView([c.latitude,c.longitude],17)}else me.setLatLng([c.latitude,c.longitude]);try{await api('/api/ubicacion',{method:'POST',body:JSON.stringify({lat:c.latitude,lon:c.longitude,accuracy:c.accuracy})})}catch{}},e=>{locStatus.textContent='GPS: '+e.message},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function timeAgo(v){const s=Math.max(0,Math.round((Date.now()-new Date(v).getTime())/1000));return s<60?`hace ${s}s`:`hace ${Math.round(s/60)} min`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(TOKEN&&USER)startApp();else{login.dataset.role='admin';loadEncChoices()}
</script></body></html>
